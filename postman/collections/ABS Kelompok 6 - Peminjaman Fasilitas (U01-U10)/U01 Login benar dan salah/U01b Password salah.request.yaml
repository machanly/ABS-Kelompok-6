$kind: http-request
url: "{{katalog_url}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "mhs_budi",
      "password": "salah-total"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 401", () => pm.response.to.have.status(401));
      pm.test("error.code = INVALID_CREDENTIALS", () => pm.expect(pm.response.json().error.code).to.eql("INVALID_CREDENTIALS"));
      pm.test("Tanpa JWT pada respons", () => pm.expect(pm.response.text()).to.not.include('access_token'));
    language: text/javascript
order: 2000
