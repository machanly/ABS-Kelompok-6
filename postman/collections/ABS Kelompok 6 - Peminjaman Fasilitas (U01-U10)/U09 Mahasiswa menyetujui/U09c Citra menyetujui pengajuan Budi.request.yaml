$kind: http-request
url: "{{peminjaman_url}}/peminjaman/{{loan_e}}"
method: PATCH
headers:
  Accept: application/json
  Authorization: Bearer {{token_citra}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "approved"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
