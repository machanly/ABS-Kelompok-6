$kind: http-request
url: "{{peminjaman_url}}/peminjaman"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token_expired}}
scripts:
  - type: beforeRequest
    code: |-
      const CJ = require('crypto-js');
      const b64u = (s) => CJ.enc.Base64.stringify(CJ.enc.Utf8.parse(s)).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
      const signJwt = (payload, secret) => {
        const h = b64u(JSON.stringify({alg:'HS256',typ:'JWT'}));
        const p = b64u(JSON.stringify(payload));
        const sig = CJ.enc.Base64.stringify(CJ.HmacSHA256(h + '.' + p, secret)).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
        return h + '.' + p + '.' + sig;
      };

      const now = Math.floor(Date.now()/1000);
      const secret = pm.environment.get('jwt_secret');
      if (!secret) throw new Error('Isi variabel environment jwt_secret (sama dengan JWT_SECRET di .env)');
      pm.collectionVariables.set('token_expired', signJwt({sub: String(pm.collectionVariables.get('id_budi')), username:'mhs_budi', role:'mahasiswa', iat: now-7200, exp: now-60}, secret));
      pm.collectionVariables.set('token_valid_ctrl', signJwt({sub: String(pm.collectionVariables.get('id_budi')), username:'mhs_budi', role:'mahasiswa', iat: now, exp: now+300}, secret));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status 401", () => pm.response.to.have.status(401));
      pm.test("Pesan menyebut kedaluwarsa", () => pm.expect(pm.response.json().error.message).to.match(/kedaluwarsa/i));
    language: text/javascript
order: 1000
