$kind: http-request
url: "{{peminjaman_url}}/peminjaman"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token_admin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Data bersih (total = 0). Jika gagal: reset data dulu", () => pm.expect(pm.response.json().meta.total).to.eql(0));
    language: text/javascript
order: 4000
