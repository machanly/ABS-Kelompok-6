$kind: http-request
url: "{{peminjaman_url}}/peminjaman/{{loan_a}}"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token_citra}}
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 4000
