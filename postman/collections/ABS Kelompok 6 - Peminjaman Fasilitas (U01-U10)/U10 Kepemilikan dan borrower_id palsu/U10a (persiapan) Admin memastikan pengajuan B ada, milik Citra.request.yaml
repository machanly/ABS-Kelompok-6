$kind: http-request
url: "{{peminjaman_url}}/peminjaman/{{loan_b}}"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token_admin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Milik Citra", () => pm.expect(pm.response.json().data.borrower_id).to.eql(Number(pm.collectionVariables.get('id_citra'))));
    language: text/javascript
order: 1000
