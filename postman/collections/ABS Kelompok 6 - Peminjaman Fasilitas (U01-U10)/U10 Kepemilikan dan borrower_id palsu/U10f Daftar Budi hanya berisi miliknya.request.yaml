$kind: http-request
url: "{{peminjaman_url}}/peminjaman"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token_budi}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Semua borrower_id = Budi", () => pm.expect(pm.response.json().data.every(x => x.borrower_id === Number(pm.collectionVariables.get('id_budi')))).to.eql(true));
    language: text/javascript
order: 6000
