$kind: http-request
url: "{{peminjaman_url}}/peminjaman"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{token_budi}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "facility_id": 1,
      "start_at": "2027-02-12T12:00:00Z",
      "end_at": "2027-02-12T11:00:00Z",
      "purpose": "x"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("error.code = VALIDATION_ERROR", () => pm.expect(pm.response.json().error.code).to.eql("VALIDATION_ERROR"));
    language: text/javascript
order: 2000
