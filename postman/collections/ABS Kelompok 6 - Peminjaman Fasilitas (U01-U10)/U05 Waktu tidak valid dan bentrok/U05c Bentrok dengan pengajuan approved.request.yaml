$kind: http-request
url: "{{peminjaman_url}}/peminjaman"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{token_citra}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "facility_id": 1,
      "start_at": "2027-02-10T09:00:00Z",
      "end_at": "2027-02-10T11:00:00Z",
      "purpose": "Bentrok"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("error.code = SCHEDULE_CONFLICT", () => pm.expect(pm.response.json().error.code).to.eql("SCHEDULE_CONFLICT"));
    language: text/javascript
order: 3000
