$kind: http-request
url: "{{peminjaman_url}}/peminjaman"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token_admin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.collectionVariables.set('total_before', pm.response.json().meta.total);
    language: text/javascript
order: 1000
