$kind: http-request
url: "{{peminjaman_url}}/peminjaman"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{token_citra}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "facility_id": 1,
      "start_at": "2027-02-10T10:00:00Z",
      "end_at": "2027-02-10T11:00:00Z",
      "purpose": "Bertemu di batas"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 5000
