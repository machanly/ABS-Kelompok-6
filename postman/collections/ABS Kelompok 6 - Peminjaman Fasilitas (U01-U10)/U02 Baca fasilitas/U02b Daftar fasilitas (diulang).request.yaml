$kind: http-request
url: "{{katalog_url}}/fasilitas"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token_budi}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Identik dengan GET pertama (GET tidak mengubah data)", () => pm.expect(JSON.stringify(pm.response.json())).to.eql(pm.collectionVariables.get('fas_list_1')));
    language: text/javascript
order: 2000
