$kind: http-request
url: "{{katalog_url}}/fasilitas"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token_budi}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test("4 fasilitas sesuai data awal", () => pm.expect(j.data.map(f => f.name)).to.eql(["Aula Serbaguna Merdeka","Laboratorium Multimedia","Proyektor Portabel","Ruang Diskusi Perpustakaan"]));
      pm.collectionVariables.set('fas_list_1', JSON.stringify(j));
    language: text/javascript
order: 1000
