$kind: http-request
url: "{{katalog_url}}/fasilitas/1"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token_budi}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("id = 1", () => pm.expect(pm.response.json().data.id).to.eql(1));
    language: text/javascript
order: 3000
