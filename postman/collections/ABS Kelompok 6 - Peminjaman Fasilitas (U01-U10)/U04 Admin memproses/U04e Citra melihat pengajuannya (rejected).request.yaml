$kind: http-request
url: "{{peminjaman_url}}/peminjaman/{{loan_b}}"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token_citra}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("rejected", () => pm.expect(pm.response.json().data.status).to.eql("rejected"));
    language: text/javascript
order: 5000
