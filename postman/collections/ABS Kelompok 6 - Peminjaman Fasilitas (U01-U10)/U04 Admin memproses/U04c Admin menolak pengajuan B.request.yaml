$kind: http-request
url: "{{peminjaman_url}}/peminjaman/{{loan_b}}"
method: PATCH
headers:
  Accept: application/json
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "rejected"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("status rejected", () => pm.expect(pm.response.json().data.status).to.eql("rejected"));
    language: text/javascript
order: 3000
